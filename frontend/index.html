<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS-D1000 System Configuration Test</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section id="login-view" class="view">
      <div class="card login-card">
        <div class="brand">
          <div class="brand-mark">TS</div>
          <div>
            <h1>TS-D1000 Control Desk</h1>
            <p>Authentication + Role-Based Access + System Configuration</p>
          </div>
        </div>

        <form id="login-form" novalidate>
          <label class="field">
            <span>Username</span>
            <input id="username" name="username" type="text" autocomplete="username" />
            <small class="field-error" data-field-error="username"></small>
          </label>

          <label class="field">
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <small class="field-error" data-field-error="password"></small>
          </label>

          <div id="login-error" class="alert hidden" role="alert"></div>

          <button id="login-button" class="button primary" type="submit">
            <span class="button-label">Login</span>
            <span class="button-spinner hidden"></span>
          </button>
        </form>

        <div class="seed-box">
          <strong>Seed accounts</strong>
          <p><code>admin / Admin123!</code></p>
          <p><code>operator / Operator123!</code></p>
        </div>
      </div>
    </section>

    <section id="app-view" class="view hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark small">TS</div>
          <div>
            <h2>Control Desk</h2>
            <p id="role-badge"></p>
          </div>
        </div>
        <nav>
          <button class="nav-item nav-button active" data-view="dashboard" type="button">Dashboard</button>
          <button class="nav-item nav-button" data-view="runtime-map" type="button">Map View</button>
          <button class="nav-item nav-button" data-view="runtime-cameras" type="button">Camera View</button>
          <button class="nav-item nav-button" data-view="runtime-manual" type="button">Manual Control</button>
          <button class="nav-item nav-button" data-view="runtime-monitor" type="button">Runtime Monitor</button>
          <button class="nav-item nav-button" data-view="overview" type="button">Config Overview</button>
          <button class="nav-item nav-button" data-view="tsd" type="button">TS-D1000</button>
          <button class="nav-item nav-button" data-view="cameras" type="button">Cameras</button>
          <button class="nav-item nav-button" data-view="layout" type="button">Layout & Map</button>
          <button class="nav-item nav-button" data-view="mappings" type="button">Mappings</button>
          <button class="nav-item nav-button" data-view="mode" type="button">Operation Mode</button>
          <button class="nav-item nav-button" data-view="readiness" type="button">Readiness Check</button>
          <button class="nav-item nav-button admin-only" data-view="logs" type="button">Logs</button>
        </nav>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="room-chip">Room</p>
            <h3 id="welcome-title">Dashboard</h3>
            <div class="topbar-status">
              <button id="mode-badge" class="status-pill badge-button hidden" type="button"></button>
              <span id="sse-badge" class="status-pill hidden"></span>
            </div>
          </div>
          <div class="user-chip">
            <span id="username-chip"></span>
            <button id="logout-button" class="button danger ghost" type="button">Logout</button>
          </div>
        </header>

        <div id="session-message" class="alert hidden" role="status"></div>
        <div id="view-error" class="alert hidden" role="alert"></div>

        <section id="dashboard-section" class="view-panel"></section>
        <section id="runtime-map-section" class="view-panel hidden"></section>
        <section id="runtime-cameras-section" class="view-panel hidden"></section>
        <section id="runtime-manual-section" class="view-panel hidden"></section>
        <section id="runtime-monitor-section" class="view-panel hidden"></section>
        <section id="overview-section" class="view-panel hidden"></section>
        <section id="tsd-section" class="view-panel hidden"></section>
        <section id="cameras-section" class="view-panel hidden"></section>
        <section id="layout-section" class="view-panel hidden"></section>
        <section id="mappings-section" class="view-panel hidden"></section>
        <section id="mode-section" class="view-panel hidden"></section>
        <section id="readiness-section" class="view-panel hidden"></section>
        <section id="logs-section" class="view-panel hidden"></section>
      </section>
    </section>
  </main>

  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
