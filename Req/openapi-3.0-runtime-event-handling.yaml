openapi: 3.0.3
info:
  title: TS-D1000 Runtime Event Handling API
  version: 1.0.0
  description: >
    OpenAPI contract for Runtime Event Handling (MVP single-room).
    Based on approved Use Cases + Detail Design. No extra endpoints added.

servers:
  - url: /

tags:
  - name: Runtime
    description: Runtime snapshot, speaking requests, approve/reject
  - name: InternalRuntime
    description: Internal runtime controls (admin only)

security:
  - bearerAuth: []

paths:
  /api/v1/runtime/snapshot:
    get:
      tags: [Runtime]
      summary: Get runtime snapshot
      description: Returns current operation mode, SSE status, speakers, pending requests, and camera target.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSnapshotEnvelope"
              examples:
                ok:
                  value:
                    success: true
                    data:
                      operationMode: MANUAL
                      sseStatus: CONNECTED
                      activeSpeakers:
                        - 11111111-1111-1111-1111-111111111111
                      pendingRequests:
                        - 22222222-2222-2222-2222-222222222222
                      currentCameraTarget:
                        unitId: 11111111-1111-1111-1111-111111111111
                        cameraId: 33333333-3333-3333-3333-333333333333
                        presetId: 44444444-4444-4444-4444-444444444444
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/SystemError"

  /api/v1/runtime/requests:
    get:
      tags: [Runtime]
      summary: List speaking requests
      description: Returns speaking requests (queue for Manual mode).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SpeakingRequestStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakingRequestListEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/SystemError"

  /api/v1/runtime/requests/{id}/approve:
    post:
      tags: [Runtime]
      summary: Approve a speaking request
      description: Approves a PENDING request in MANUAL mode. Unit becomes SPEAKING only after TS-D event confirmation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveRejectEnvelope"
              examples:
                ok:
                  value:
                    success: true
                    data:
                      requestId: 22222222-2222-2222-2222-222222222222
                      status: APPROVED
                      actedAt: 2026-04-21T10:01:00Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RequestNotFound"
        "422":
          $ref: "#/components/responses/BusinessError"
        "502":
          $ref: "#/components/responses/IntegrationError"
        "503":
          $ref: "#/components/responses/IntegrationError"
        "500":
          $ref: "#/components/responses/SystemError"

  /api/v1/runtime/requests/{id}/reject:
    post:
      tags: [Runtime]
      summary: Reject a speaking request
      description: Rejects a PENDING request. Does not trigger camera.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveRejectEnvelope"
              examples:
                ok:
                  value:
                    success: true
                    data:
                      requestId: 22222222-2222-2222-2222-222222222222
                      status: REJECTED
                      actedAt: 2026-04-21T10:01:30Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RequestNotFound"
        "422":
          $ref: "#/components/responses/BusinessError"
        "502":
          $ref: "#/components/responses/IntegrationError"
        "503":
          $ref: "#/components/responses/IntegrationError"
        "500":
          $ref: "#/components/responses/SystemError"

  /internal/runtime/start:
    post:
      tags: [InternalRuntime]
      summary: Start runtime listener (internal)
      description: Admin-only internal endpoint to start SSE listener and runtime processing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalRuntimeControlEnvelope"
              examples:
                ok:
                  value:
                    success: true
                    data:
                      started: true
                      sseStatus: CONNECTED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/IntegrationError"
        "503":
          $ref: "#/components/responses/IntegrationError"
        "500":
          $ref: "#/components/responses/SystemError"

  /internal/runtime/stop:
    post:
      tags: [InternalRuntime]
      summary: Stop runtime listener (internal)
      description: Admin-only internal endpoint to stop SSE listener.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalRuntimeControlEnvelope"
              examples:
                ok:
                  value:
                    success: true
                    data:
                      stopped: true
                      sseStatus: DISCONNECTED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/SystemError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            example:
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Invalid query parameter
                  details: null
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            example:
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Unauthorized
                  details: null
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            example:
              value:
                success: false
                error:
                  code: FORBIDDEN
                  message: Forbidden
                  details: null
    RequestNotFound:
      description: Request not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            example:
              value:
                success: false
                error:
                  code: REQUEST_NOT_FOUND
                  message: Request not found
                  details: null
    BusinessError:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notPending:
              value:
                success: false
                error:
                  code: REQUEST_NOT_PENDING
                  message: Request is not in pending state
                  details: null
            manualRequired:
              value:
                success: false
                error:
                  code: MANUAL_MODE_REQUIRED
                  message: Manual mode is required
                  details: null
    IntegrationError:
      description: Integration error (TS-D1000, network)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            example:
              value:
                success: false
                error:
                  code: INTEGRATION_ERROR
                  message: TS-D1000 unreachable
                  details: null
    SystemError:
      description: System error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            example:
              value:
                success: false
                error:
                  code: SYSTEM_ERROR
                  message: Internal server error
                  details: null

  schemas:
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorObject"

    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true

    OperationMode:
      type: string
      enum: [MANUAL, AUTOMATIC]

    SseStatus:
      type: string
      enum: [CONNECTED, RECONNECTING, DISCONNECTED]

    SpeakingRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED]

    CurrentCameraTarget:
      type: object
      required: [unitId, cameraId, presetId]
      properties:
        unitId:
          type: string
          format: uuid
        cameraId:
          type: string
          format: uuid
        presetId:
          type: string
          format: uuid

    RuntimeSnapshot:
      type: object
      required: [operationMode, sseStatus, activeSpeakers, pendingRequests, currentCameraTarget]
      properties:
        operationMode:
          $ref: "#/components/schemas/OperationMode"
        sseStatus:
          $ref: "#/components/schemas/SseStatus"
        activeSpeakers:
          type: array
          items:
            type: string
            format: uuid
        pendingRequests:
          type: array
          items:
            type: string
            format: uuid
        currentCameraTarget:
          allOf:
            - $ref: "#/components/schemas/CurrentCameraTarget"
          nullable: true

    RuntimeSnapshotEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/RuntimeSnapshot"

    SpeakingRequest:
      type: object
      required: [id, unitId, status, createdAt, updatedAt, handledBy]
      properties:
        id:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SpeakingRequestStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        handledBy:
          type: string
          format: uuid
          nullable: true

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    SpeakingRequestListData:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpeakingRequest"
        pagination:
          $ref: "#/components/schemas/Pagination"

    SpeakingRequestListEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/SpeakingRequestListData"

    ApproveRejectResult:
      type: object
      required: [requestId, status, actedAt]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SpeakingRequestStatus"
        actedAt:
          type: string
          format: date-time

    ApproveRejectEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/ApproveRejectResult"

    InternalRuntimeControlData:
      type: object
      properties:
        started:
          type: boolean
        stopped:
          type: boolean
        sseStatus:
          $ref: "#/components/schemas/SseStatus"

    InternalRuntimeControlEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/InternalRuntimeControlData"

