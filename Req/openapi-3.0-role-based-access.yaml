openapi: 3.0.3
info:
  title: TS-D1000 Authentication and Role-Based Access API
  version: 1.0.0
  description: >
    Implementation-ready API contract for Authentication and Role-Based Access.
    Covers login, logout, current authenticated user, and reusable RBAC enforcement patterns.

servers:
  - url: /api/v1

tags:
  - name: Authentication
    description: Login, logout, and current authenticated user APIs
  - name: Role-Based Access
    description: Authorization and RBAC enforcement patterns

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      description: Authenticate a user and create a new session-backed access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: StrongPass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '403':
          $ref: '#/components/responses/UserInactiveError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: Revoke the current authenticated session.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '401':
          description: Unauthorized, expired session, or revoked session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthorized:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized
                      details: []
                sessionExpired:
                  value:
                    success: false
                    error:
                      code: SESSION_EXPIRED
                      message: Session expired
                      details: []
                sessionRevoked:
                  value:
                    success: false
                    error:
                      code: SESSION_REVOKED
                      message: Session revoked
                      details: []
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      description: Resolve current authenticated user and session context for frontend bootstrap and RBAC.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current auth context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeEnvelope'
        '401':
          description: Unauthorized, expired session, or revoked session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthorized:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Unauthorized
                      details: []
                sessionExpired:
                  value:
                    success: false
                    error:
                      code: SESSION_EXPIRED
                      message: Session expired
                      details: []
                sessionRevoked:
                  value:
                    success: false
                    error:
                      code: SESSION_REVOKED
                      message: Session revoked
                      details: []
        '403':
          $ref: '#/components/responses/UserInactiveError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/example-protected-resource:
    get:
      tags: [Role-Based Access]
      summary: Example admin-only protected endpoint
      description: Reference endpoint pattern showing how RBAC should be applied to admin-only resources.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExampleEnvelope'
        '401':
          description: Missing or invalid auth context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      additionalProperties: false

    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ErrorDetail'
              - type: object
      additionalProperties: false

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false

    UserRole:
      type: string
      enum: [ADMIN, OPERATOR]

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    AuthenticatedUser:
      type: object
      required: [id, username, role, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
      additionalProperties: false

    AuthSessionSummary:
      type: object
      required: [id, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          description: Trimmed, case-insensitive username
        password:
          type: string
          minLength: 1
      additionalProperties: false

    LoginResponseData:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
      additionalProperties: false

    LoginEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/LoginResponseData'
      additionalProperties: false

    LogoutResponseData:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Logged out
      additionalProperties: false

    LogoutEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/LogoutResponseData'
      additionalProperties: false

    AuthMeResponseData:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        session:
          $ref: '#/components/schemas/AuthSessionSummary'
      additionalProperties: false

    AuthMeEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AuthMeResponseData'
      additionalProperties: false

    AdminExampleResponseData:
      type: object
      required: [resource]
      properties:
        resource:
          type: string
          example: example
      additionalProperties: false

    AdminExampleEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AdminExampleResponseData'
      additionalProperties: false

  responses:
    ValidationError:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: username is required
              details:
                - field: username
                  message: must not be empty

    InvalidCredentialsError:
      description: Invalid username or password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: INVALID_CREDENTIALS
              message: Invalid username or password
              details: []

    UserInactiveError:
      description: User account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: USER_INACTIVE
              message: User account is inactive
              details: []

    ForbiddenError:
      description: Role denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to access this resource
              details: []

    InternalError:
      description: Unexpected system error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Unexpected server error
              details: []
